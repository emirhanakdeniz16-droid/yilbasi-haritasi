<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Küresel Yılbaşı Haritası — Canlı Veritabanı</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #050814;
      --panel: rgba(13, 20, 40, 0.9);
      --panel-2: rgba(25, 36, 68, 0.92);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #facc15;
      --ok: #22c55e;
      --warn: #f97316;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: radial-gradient(circle at 38% 50%, #0f1b3d 0%, #04060e 100%);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .title-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .badge {
      background: rgba(250, 204, 21, 0.15);
      color: var(--gold);
      border: 1px solid rgba(250, 204, 21, 0.4);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .live-pill {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, select, button {
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 7px 11px;
      font-size: 13px;
    }
    input, select { background: rgba(5, 8, 20, 0.9); color: var(--text); }
    button {
      background: var(--accent);
      color: #04101f;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: var(--panel-2); color: var(--text); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .main-stage {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }
    #globeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #globeCanvas:active { cursor: grabbing; }

    #pinsLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .globe-pin {
      position: absolute;
      pointer-events: auto;
      background: rgba(8, 13, 28, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.7);
      color: #fff;
      padding: 5px 9px;
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.25;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
      cursor: pointer;
      user-select: none;
      transform: translate(-50%, -115%);
    }
    .globe-pin:hover, .globe-pin.selected {
      border-color: #facc15;
      background: rgba(24, 34, 62, 0.98);
      z-index: 50;
    }
    .pin-pts { color: #facc15; font-weight: 800; }
    .pin-vel { color: #4ade80; font-weight: 700; margin-left: 5px; }

    .sidebar {
      position: absolute;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 365px;
      max-width: calc(100vw - 32px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 15;
      pointer-events: none;
    }
    .card {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .detail-scroll { overflow-y: auto; flex: 1; }
    .leader-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent;
      border-radius: 10px;
      margin-top: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .leader-item:hover, .leader-item.active {
      border-color: var(--gold);
      background: rgba(250, 204, 21, 0.09);
    }
    .speed-tag {
      font-size: 11px;
      color: var(--ok);
      font-weight: 700;
      margin-left: 6px;
    }
    .city-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 9px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 7px;
      margin-top: 5px;
      font-size: 12.5px;
    }
    .ad-board {
      margin-top: 12px;
      padding: 11px;
      border-radius: 10px;
      border: 1px dashed rgba(250, 204, 21, 0.55);
      background: rgba(250, 204, 21, 0.07);
    }
    .status-msg { margin-top: 8px; font-size: 12.5px; color: var(--ok); min-height: 16px; }
    .warn-msg { color: var(--warn); }

    .hint-box {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 9px 13px;
      border-radius: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      body { overflow: auto; height: auto; }
      .main-stage { height: 52vh; min-height: 360px; }
      .sidebar { position: static; width: 100%; max-width: 100%; padding: 12px; }
      .hint-box { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-wrap">
      <strong>🌍 Küresel Yılbaşı 3D Haritası</strong>
      <span class="badge">⏳ Yılbaşına 1 Ay Kala • Canlı Turnuva</span>
      <span class="live-pill" id="dbStatus">Supabase Bağlanıyor...</span>
    </div>
    <div class="controls">
      <input id="inviteLink" readonly size="28" />
      <button class="secondary" onclick="copyInvite()">Linki Kopyala</button>
      <button onclick="simulateInvite()">Davet Testi (+25)</button>
    </div>
  </header>

  <div class="main-stage" id="stage">
    <canvas id="globeCanvas"></canvas>
    <div id="pinsLayer"></div>

    <div class="hint-box">
      🖱️ Küreyi sürükleyerek çevir • Ülke balonuna tıkla ve şehir detaylarını gör
    </div>

    <aside class="sidebar">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="margin:0; font-size:15px;">🏆 İlk 5 Ülke</h3>
          <span style="font-size:11px; color:var(--muted);">Son 1 dk Hız (puan/dk)</span>
        </div>
        <div id="topFive"></div>
      </div>

      <div class="card detail-scroll">
        <h3 style="margin:0 0 8px 0; font-size:15px;" id="selectedTitle">Ülke Detayı</h3>
        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
          <select id="citySelect"></select>
          <button id="joinBtn" onclick="joinOnce()">1 Kez Katıl (+50)</button>
        </div>
        <div class="status-msg" id="statusMsg"></div>

        <div id="cityList" style="margin-top:8px;"></div>

        <div class="ad-board">
          <div style="font-size:11px; color:var(--gold); font-weight:800;">📌 ÜLKE REKLAM PANOSU</div>
          <div id="adContent" style="margin-top:5px; font-size:12.5px; line-height:1.4;"></div>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const SUPABASE_URL = "https://lmmzdhvphwiqjbferkcu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wHf6YmZ-_V4Ej3P1tAKwEQ_ssLnlj7i";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const VISITOR_KEY = "yilbasi_3d_visitor_id_v1";
    const JOINED_LOCAL_KEY = "yilbasi_3d_joined_local_v1";

    function getVisitorId() {
      let id = "";
      try {
        id = localStorage.getItem(VISITOR_KEY) || "";
        if (!id) {
          id = "v_" + Math.random().toString(36).slice(2, 10) + "_" + Date.now().toString(36);
          localStorage.setItem(VISITOR_KEY, id);
        }
      } catch (e) {
        id = "v_temp_" + Math.random().toString(36).slice(2, 10);
      }
      return id;
    }

    const visitorId = getVisitorId();

    const fallbackData = {
      TR: { code: "TR", name: "Türkiye", flag: "🇹🇷", lat: 39.0, lng: 35.2, points: 18450, velocity: 0, cities: { "İstanbul": 7820, "Ankara": 4310, "İzmir": 3420, "Bursa": 2900 }, ad: "Türkiye Panosu" },
      BR: { code: "BR", name: "Brezilya", flag: "🇧🇷", lat: -14.2, lng: -51.9, points: 17920, velocity: 0, cities: { "São Paulo": 8910, "Rio de Janeiro": 5420, "Curitiba": 3590 }, ad: "Brasil Board" },
      US: { code: "US", name: "ABD", flag: "🇺🇸", lat: 39.8, lng: -98.5, points: 16540, velocity: 0, cities: { "New York": 7100, "Los Angeles": 5640, "Chicago": 3800 }, ad: "US Board" },
      DE: { code: "DE", name: "Almanya", flag: "🇩🇪", lat: 51.1, lng: 10.4, points: 14890, velocity: 0, cities: { "Berlin": 6400, "Münih": 4790, "Hamburg": 3700 }, ad: "Deutschland Board" },
      JP: { code: "JP", name: "Japonya", flag: "🇯🇵", lat: 36.2, lng: 138.2, points: 13720, velocity: 0, cities: { "Tokyo": 7400, "Osaka": 3820, "Kyoto": 2500 }, ad: "Japan Board" },
      AR: { code: "AR", name: "Arjantin", flag: "🇦🇷", lat: -38.4, lng: -63.6, points: 11980, velocity: 0, cities: { "Buenos Aires": 7100, "Córdoba": 2880, "Rosario": 2000 }, ad: "Tablero Argentina" },
      KR: { code: "KR", name: "Güney Kore", flag: "🇰🇷", lat: 35.9, lng: 127.7, points: 11250, velocity: 0, cities: { "Seul": 7300, "Busan": 2450, "Incheon": 1500 }, ad: "Korea Board" }
    };

    const continents = [
      [[-165,65],[-140,70],[-95,72],[-60,55],[-75,35],[-82,25],[-105,20],[-122,37],[-135,58]],
      [[-80,10],[-60,8],[-35,-6],[-40,-23],[-58,-38],[-70,-53],[-75,-18]],
      [[-10,36],[0,43],[10,54],[28,70],[55,65],[45,42],[25,36],[12,42]],
      [[-17,15],[10,35],[34,31],[50,11],[40,-15],[20,-34],[12,-18],[8,4]],
      [[28,41],[60,72],[135,70],[165,60],[140,36],[120,22],[102,3],[78,8],[65,25],[45,38]],
      [[114,-22],[132,-12],[152,-26],[147,-38],[116,-34]]
    ];

    let state = structuredClone(fallbackData);
    let prevPointsMap = {};
    let selectedCode = "TR";
    let pulses = [];
    let isBusy = false;

    // URL'de ?ref=TR gibi davet kodu varsa ülkeyi seç ve davet puanı işle
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = (urlParams.get("ref") || "").toUpperCase();
    if (refCode && state[refCode]) {
      selectedCode = refCode;
    }

    function updateInviteInput() {
      const base = window.location.href.split("?")[0];
      document.getElementById("inviteLink").value = `${base}?ref=${selectedCode}`;
    }

    function triggerPulse(code) {
      const c = state[code];
      if (!c) return;
      pulses.push({ lat: c.lat, lng: c.lng, progress: 0 });
      if (pulses.length > 12) pulses.shift();
    }

    async function fetchLiveState() {
      const statusEl = document.getElementById("dbStatus");
      try {
        const { data, error } = await sb.rpc("get_live_globe_state");
        if (error) throw error;
        if (Array.isArray(data) && data.length > 0) {
          const nextState = {};
          data.forEach(item => {
            nextState[item.code] = {
              code: item.code,
              name: item.name,
              flag: item.flag,
              lat: Number(item.lat),
              lng: Number(item.lng),
              points: Number(item.points) || 0,
              velocity: Number(item.velocity) || 0,
              cities: item.cities || {},
              ad: item.ad || ""
            };

            if (prevPointsMap[item.code] !== undefined && nextState[item.code].points > prevPointsMap[item.code]) {
              triggerPulse(item.code);
            }
            prevPointsMap[item.code] = nextState[item.code].points;
          });

          state = nextState;
          if (!state[selectedCode]) selectedCode = Object.keys(state)[0];
          statusEl.textContent = "🟢 Supabase Canlı";
          statusEl.className = "live-pill";
          renderUI();
        }
      } catch (err) {
        statusEl.textContent = "🟡 Yerel Mod (DB Kontrol)";
        statusEl.className = "badge";
      }
    }

    // Sayfa ?ref= parametresiyle açıldıysa tek seferlik davet puanı ekle
    async function handleIncomingRef() {
      if (!refCode || !state[refCode]) return;
      const refGuardKey = "yilbasi_3d_ref_used_" + refCode;
      try {
        if (localStorage.getItem(refGuardKey) === "1") return;
        localStorage.setItem(refGuardKey, "1");
      } catch (e) {}

      const firstCity = Object.keys(state[refCode].cities)[0] || "Merkez";
      await sb.rpc("record_invite_join", {
        p_country_code: refCode,
        p_city_name: firstCity,
        p_visitor_id: visitorId
      });
      await fetchLiveState();
      document.getElementById("statusMsg").textContent = `Davet bağlantısından ${state[refCode].name} için +25 puan eklendi!`;
    }

    // --- SAF CANVAS 3D KÜRE MOTORU ---
    const canvas = document.getElementById("globeCanvas");
    const ctx = canvas.getContext("2d");
    const pinsLayer = document.getElementById("pinsLayer");

    let rotLng = -35;
    let rotLat = 18;
    let autoRotate = true;
    let isDragging = false;
    let lastX = 0, lastY = 0;

    const stars = Array.from({ length: 140 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.4 + 0.3,
      a: Math.random() * 0.7 + 0.2
    }));

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, rect.width) * dpr;
      canvas.height = Math.max(1, rect.height) * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    canvas.addEventListener("mousedown", e => {
      isDragging = true;
      autoRotate = false;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    window.addEventListener("mousemove", e => {
      if (!isDragging) return;
      rotLng += (e.clientX - lastX) * 0.35;
      rotLat = Math.max(-65, Math.min(65, rotLat + (e.clientY - lastY) * 0.25));
      lastX = e.clientX;
      lastY = e.clientY;
    });
    window.addEventListener("mouseup", () => {
      if (isDragging) {
        isDragging = false;
        setTimeout(() => { if (!isDragging) autoRotate = true; }, 2200);
      }
    });

    function project(lat, lng, cx, cy, R) {
      const phi = (lat * Math.PI) / 180;
      const lambda = ((lng + rotLng) * Math.PI) / 180;
      const tilt = (rotLat * Math.PI) / 180;

      const x0 = Math.cos(phi) * Math.sin(lambda);
      const y0 = Math.sin(phi);
      const z0 = Math.cos(phi) * Math.cos(lambda);

      const y1 = y0 * Math.cos(tilt) - z0 * Math.sin(tilt);
      const z1 = y0 * Math.sin(tilt) + z0 * Math.cos(tilt);

      return { x: cx + x0 * R, y: cy - y1 * R, z: z1, visible: z1 > 0.05 };
    }

    function selectCountry(code, focusCamera = false) {
      if (!state[code]) return;
      selectedCode = code;
      updateInviteInput();
      if (focusCamera) {
        autoRotate = false;
        rotLng = -state[code].lng;
        rotLat = state[code].lat * 0.55;
        setTimeout(() => { autoRotate = true; }, 3200);
      }
      renderUI();
    }

    const pinElements = {};
    function ensurePinElements() {
      Object.values(state).forEach(item => {
        if (!pinElements[item.code]) {
          const el = document.createElement("div");
          el.className = "globe-pin";
          el.onclick = () => selectCountry(item.code, true);
          pinsLayer.appendChild(el);
          pinElements[item.code] = el;
        }
      });
    }

    function drawGlobe() {
      ensurePinElements();
      const w = Math.max(1, canvas.clientWidth);
      const h = Math.max(1, canvas.clientHeight);
      ctx.clearRect(0, 0, w, h);

      stars.forEach(s => {
        ctx.fillStyle = `rgba(226, 232, 240, ${s.a})`;
        ctx.beginPath();
        ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      const isMobile = w <= 820;
      const availW = isMobile ? w : Math.max(240, w - 390);
      const cx = isMobile ? w * 0.5 : availW * 0.52;
      const cy = h * 0.5;
      const R = Math.max(40, Math.min(availW * 0.42, h * 0.41, 270));

      if (autoRotate) rotLng = (rotLng + 0.14) % 360;

      const atmo = ctx.createRadialGradient(cx, cy, R * 0.85, cx, cy, R * 1.18);
      atmo.addColorStop(0, "rgba(56, 189, 248, 0.22)");
      atmo.addColorStop(1, "rgba(56, 189, 248, 0)");
      ctx.fillStyle = atmo;
      ctx.beginPath();
      ctx.arc(cx, cy, R * 1.18, 0, Math.PI * 2);
      ctx.fill();

      const ocean = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
      ocean.addColorStop(0, "#173063");
      ocean.addColorStop(0.65, "#0b1736");
      ocean.addColorStop(1, "#050a1a");
      ctx.fillStyle = ocean;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.clip();

      ctx.strokeStyle = "rgba(56, 189, 248, 0.12)";
      ctx.lineWidth = 1;
      for (let lat = -60; lat <= 60; lat += 30) {
        ctx.beginPath();
        let started = false;
        for (let lng = -180; lng <= 180; lng += 6) {
          const p = project(lat, lng, cx, cy, R);
          if (p.z > 0) {
            if (!started) { ctx.moveTo(p.x, p.y); started = true; }
            else ctx.lineTo(p.x, p.y);
          } else started = false;
        }
        ctx.stroke();
      }
      for (let lng = -180; lng < 180; lng += 30) {
        ctx.beginPath();
        let started = false;
        for (let lat = -90; lat <= 90; lat += 6) {
          const p = project(lat, lng, cx, cy, R);
          if (p.z > 0) {
            if (!started) { ctx.moveTo(p.x, p.y); started = true; }
            else ctx.lineTo(p.x, p.y);
          } else started = false;
        }
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(34, 197, 94, 0.24)";
      ctx.strokeStyle = "rgba(74, 222, 128, 0.48)";
      ctx.lineWidth = 1.2;
      continents.forEach(poly => {
        ctx.beginPath();
        let visibleCount = 0;
        poly.forEach(([lng, lat], i) => {
          const p = project(lat, lng, cx, cy, R);
          if (p.z > -0.15) visibleCount++;
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        if (visibleCount >= 2) {
          ctx.fill();
          ctx.stroke();
        }
      });

      pulses.forEach(pulse => {
        pulse.progress += 0.018;
        const p = project(pulse.lat, pulse.lng, cx, cy, R);
        if (p.visible && pulse.progress < 1) {
          ctx.strokeStyle = `rgba(250, 204, 21, ${1 - pulse.progress})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4 + pulse.progress * 26, 0, Math.PI * 2);
          ctx.stroke();
        }
      });
      pulses = pulses.filter(p => p.progress < 1);

      Object.values(state).forEach(item => {
        const p = project(item.lat, item.lng, cx, cy, R);
        const el = pinElements[item.code];
        if (!el) return;

        if (p.visible) {
          ctx.fillStyle = item.code === selectedCode ? "#facc15" : "#38bdf8";
          ctx.beginPath();
          ctx.arc(p.x, p.y, item.code === selectedCode ? 5.5 : 4, 0, Math.PI * 2);
          ctx.fill();

          el.style.display = "block";
          el.style.left = `${p.x}px`;
          el.style.top = `${p.y}px`;
          el.style.opacity = Math.min(1, p.z * 2.2);
          el.className = "globe-pin" + (item.code === selectedCode ? " selected" : "");
          el.innerHTML = `
            <div><strong>${item.flag} ${item.name}</strong></div>
            <div><span class="pin-pts">${item.points.toLocaleString("tr-TR")}</span><span class="pin-vel">⚡+${item.velocity}/dk</span></div>
          `;
        } else {
          el.style.display = "none";
        }
      });

      ctx.restore();

      ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.stroke();

      requestAnimationFrame(drawGlobe);
    }

    function renderUI() {
      renderTopFive();
      renderDetail();
      updateJoinButton();
    }

    function renderTopFive() {
      const top = Object.values(state)
        .sort((a, b) => b.points - a.points)
        .slice(0, 5);
      const container = document.getElementById("topFive");
      container.innerHTML = "";
      top.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "leader-item" + (item.code === selectedCode ? " active" : "");
        row.onclick = () => selectCountry(item.code, true);
        row.innerHTML = `
          <span><strong>#${idx + 1}</strong> ${item.flag} ${item.name}</span>
          <span>
            <strong style="color:var(--gold);">${item.points.toLocaleString("tr-TR")}</strong>
            <span class="speed-tag">⚡+${item.velocity}/dk</span>
          </span>
        `;
        container.appendChild(row);
      });
    }

    function renderDetail() {
      const item = state[selectedCode];
      if (!item) return;
      document.getElementById("selectedTitle").innerHTML =
        `${item.flag} ${item.name} • <span style="color:var(--gold);">${item.points.toLocaleString("tr-TR")}</span> <span class="speed-tag">⚡+${item.velocity}/dk</span>`;

      const select = document.getElementById("citySelect");
      const prevCity = select.value;
      select.innerHTML = "";
      Object.keys(item.cities).forEach(city => {
        const opt = document.createElement("option");
        opt.value = city;
        opt.textContent = city;
        select.appendChild(opt);
      });
      if (prevCity && item.cities[prevCity] !== undefined) select.value = prevCity;

      const cityList = document.getElementById("cityList");
      cityList.innerHTML = "<div style='font-size:11.5px; color:var(--muted);'>Şehir Katkı Sıralaması</div>";
      Object.entries(item.cities)
        .sort((a, b) => b[1] - a[1])
        .forEach(([city, pts]) => {
          const d = document.createElement("div");
          d.className = "city-row";
          d.innerHTML = `<span>${city}</span><strong>${pts.toLocaleString("tr-TR")}</strong>`;
          cityList.appendChild(d);
        });

      document.getElementById("adContent").textContent = item.ad || "Bu ülke için reklam panosu alanı.";
    }

    function updateJoinButton() {
      let alreadyJoined = false;
      try { alreadyJoined = localStorage.getItem(JOINED_LOCAL_KEY) === "1"; } catch (e) {}
      const btn = document.getElementById("joinBtn");
      const msg = document.getElementById("statusMsg");
      btn.disabled = alreadyJoined || isBusy;
      if (alreadyJoined) {
        msg.textContent = "Tek katılım hakkın kullanıldı. Davet linkini paylaşarak puan kazandırabilirsin.";
        msg.className = "status-msg warn-msg";
      } else {
        msg.textContent = "Şehrini seç ve ülken için 1 kez katılım puanı bırak.";
        msg.className = "status-msg";
      }
    }

    async function joinOnce() {
      if (isBusy) return;
      isBusy = true;
      updateJoinButton();

      const city = document.getElementById("citySelect").value || "Merkez";
      const { data, error } = await sb.rpc("join_country_once", {
        p_country_code: selectedCode,
        p_city_name: city,
        p_visitor_id: visitorId
      });

      isBusy = false;

      if (!error && data && data.ok) {
        try { localStorage.setItem(JOINED_LOCAL_KEY, "1"); } catch (e) {}
        triggerPulse(selectedCode);
        await fetchLiveState();
        document.getElementById("statusMsg").textContent = `${state[selectedCode].name} (${city}) için +50 puan veritabanına işlendi!`;
      } else if (data && data.reason === "already_joined") {
        try { localStorage.setItem(JOINED_LOCAL_KEY, "1"); } catch (e) {}
        document.getElementById("statusMsg").textContent = "Bu kullanıcı kimliğiyle daha önce katılım yapılmış.";
        document.getElementById("statusMsg").className = "status-msg warn-msg";
      } else {
        document.getElementById("statusMsg").textContent = "Bağlantı hatası oluştu, tekrar dene.";
        document.getElementById("statusMsg").className = "status-msg warn-msg";
      }
      updateJoinButton();
    }

    async function simulateInvite() {
      if (isBusy) return;
      isBusy = true;
      const city = Object.keys(state[selectedCode]?.cities || {})[0] || "Merkez";
      const { data, error } = await sb.rpc("record_invite_join", {
        p_country_code: selectedCode,
        p_city_name: city,
        p_visitor_id: visitorId + "_inv_" + Date.now()
      });
      isBusy = false;

      if (!error && data && data.ok) {
        triggerPulse(selectedCode);
        await fetchLiveState();
        document.getElementById("statusMsg").textContent = `Davet puanı (+25) veritabanına eklendi ve canlı hız güncellendi!`;
      }
    }

    function copyInvite() {
      const input = document.getElementById("inviteLink");
      navigator.clipboard?.writeText(input.value);
      document.getElementById("statusMsg").textContent = "Davet bağlantısı kopyalandı.";
    }

    updateInviteInput();
    renderUI();
    drawGlobe();
    handleIncomingRef().then(() => fetchLiveState());
    setInterval(fetchLiveState, 4000);
  </script>
</body>
</html>
